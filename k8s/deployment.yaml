
apiVersion: apps/v1
kind: Deployment
metadata:
  name: html-auto-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: html-auto-deployment
  template:
    metadata:
      labels:
        app: html-auto-deployment
    spec:
      containers:
        - name: website
          image: ghcr.io/habeebunissa22-sketch/html-auto-deployment:2df842344ff543ed4ab4d6dfa49b011d40a709ed
          imagePullPolicy: Always
          ports:
            - containerPort: 80
