
apiVersion: apps/v1
kind: Deployment
metadata:
  name: html-auto-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: html-auto-deployment
  template:
    metadata:
      labels:
        app: html-auto-deployment
    spec:
      containers:
        - name: website
          image: ghcr.io/habeebunissa22-sketch/html-auto-deployment:ba7698da36fc2cae5cda613065b1b56c3c32b407
          imagePullPolicy: Always
          ports:
            - containerPort: 80
