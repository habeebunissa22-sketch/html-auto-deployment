
apiVersion: apps/v1
kind: Deployment
metadata:
  name: html-auto-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: html-auto-deployment
  template:
    metadata:
      labels:
        app: html-auto-deployment
    spec:
      containers:
        - name: website
          image: ghcr.io/habeebunissa22-sketch/html-auto-deployment:6cd506b2b9011e8d24917a01b3bde461dc35a16f
          imagePullPolicy: Always
          ports:
            - containerPort: 80
