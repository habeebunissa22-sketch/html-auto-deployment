
apiVersion: apps/v1
kind: Deployment
metadata:
  name: html-auto-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: html-auto-deployment
  template:
    metadata:
      labels:
        app: html-auto-deployment
    spec:
      containers:
        - name: website
          image: ghcr.io/habeebunissa22-sketch/html-auto-deployment:617c233d6f9f46a7764d69dbaa1e59d2a6b83998
          imagePullPolicy: Always
          ports:
            - containerPort: 80
