
name: Build and Deploy Website Image

on:
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - '.github/workflows/build-image.yml'

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./site
          push: true
          tags: |
            ghcr.io/habeebunissa22-sketch/html-auto-deployment:${{ github.sha }}
            ghcr.io/habeebunissa22-sketch/html-auto-deployment:latest

      - name: Update Kubernetes manifest
        shell: bash
        run: |
          sed -i "s|image:.*|image: ghcr.io/habeebunissa22-sketch/html-auto-deployment:${GITHUB_SHA}|" k8s/deployment.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yaml
          git commit -m "Update website image to ${GITHUB_SHA}"
          git push
